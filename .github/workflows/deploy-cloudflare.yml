name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment between the two Workers.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desk/package-lock.json

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env;
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }
          if (!token || !account) {
            fail('Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.');
          }
          // Check the exact account-level endpoint Wrangler needs after uploading voice.
          // Never print credentials or the API response body.
          try {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/workers/subdomain`,
              { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30000) },
            );
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              fail(`Cloudflare workers/subdomain check failed (HTTP ${response.status}). Ensure the deployment token has Account > Workers Scripts > Edit on the account in CLOUDFLARE_ACCOUNT_ID, and check token expiry/IP restrictions. See CLOUDFLARE.md. User > Memberships > Read does not grant access to this endpoint.`);
            }
            if (!body.result?.subdomain) {
              fail('Register a workers.dev subdomain in Cloudflare Workers & Pages before deploying prosper-voice.');
            }
            console.log('Cloudflare workers.dev subdomain access verified.');
          } catch {
            fail('Could not complete the Cloudflare workers/subdomain check. Check Cloudflare availability and retry.');
          }
          NODE

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix desk ci

      - name: Check voice types
        run: npm run cf:typecheck

      - name: Build and validate both Workers
        run: |
          npm run cf:check
          npm run desk:cf:check

      - name: Apply pending D1 migrations, then deploy voice and desk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
            exit 1
          fi
          # Wrangler checks D1's migration history and exits successfully when none are pending.
          # A failed migration stops this step before either Worker is deployed.
          npm --prefix desk run db:migrate:remote
          npm run cf:deploy
          # Reuse the OpenNext output already validated above.
          cd desk
          npx --no-install wrangler deploy
