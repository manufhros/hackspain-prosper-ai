name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment between the two Workers.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desk/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix desk ci

      - name: Check voice types
        run: npm run cf:typecheck

      - name: Build and validate both Workers
        run: |
          npm run cf:check
          npm run desk:cf:check

      - name: Apply pending D1 migrations, then deploy voice and desk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Wrangler checks D1's migration history and exits successfully when none are pending.
          # A failed migration stops this step before either Worker is deployed.
          npm --prefix desk run db:migrate:remote
          npm run cf:deploy
          # Reuse the OpenNext output already validated above.
          cd desk
          npx --no-install wrangler deploy
